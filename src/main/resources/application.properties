spring.application.name=smartcityback
spring.profiles.active=dev
springdoc.swagger-ui.url=/openapi/enhanced-openapi.json

# JWT — HS256, 256-bit key. Set JWT_SECRET env var (base64-encoded, min 32 bytes).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Rate limiting — auth endpoints only (login + refresh). 10 attempts per minute per IP.
app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-per-minute=10

# In-memory users. Set ADMIN_PASSWORD and VIEWER_PASSWORD env vars.
app.security.admin.password=${ADMIN_PASSWORD}
app.security.viewer.password=${VIEWER_PASSWORD}

# =============================================================================
# GOOGLE OAUTH2 SETUP — complete step-by-step
# =============================================================================
#
# STEP 1 — Create a Google Cloud project and OAuth2 credentials
#   1. Go to https://console.cloud.google.com
#   2. Create a new project (or select an existing one)
#   3. Navigate to: APIs & Services → Credentials
#   4. Click "Create Credentials" → "OAuth 2.0 Client ID"
#   5. Application type: Web application
#   6. Under "Authorized redirect URIs", add ALL of the following that apply:
#        Dev:  http://localhost:8080/SmartCityREST/login/oauth2/code/google
#        Prod: https://<your-render-host>/SmartCityREST/login/oauth2/code/google
#   7. Click "Create" — copy the Client ID and Client Secret shown
#   8. Set env vars: GOOGLE_CLIENT_ID=<client-id>  GOOGLE_CLIENT_SECRET=<client-secret>
#
# STEP 2 — Configure the OAuth consent screen
#   1. Navigate to: APIs & Services → OAuth consent screen
#   2. User Type: External (allows any Google account to log in)
#   3. Fill in: App name, User support email, Developer contact email
#   4. Scopes: no extra scopes needed — openid, profile, email are non-sensitive
#   5. Test users: while the app is in "Testing" publishing status, ONLY Gmail
#      addresses added here can log in. Add your own address at minimum.
#   6. Save and continue through all screens
#
# STEP 3 — Publish the app (optional, removes the test-user restriction)
#   In OAuth consent screen → Publishing status → "Publish App"
#   For an educational/internal app, staying in Testing is fine.
#   Publishing requires Google verification only for sensitive or restricted scopes
#   (openid, profile, email are neither — verification is not required).
# =============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
