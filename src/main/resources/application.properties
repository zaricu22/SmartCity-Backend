spring.application.name=smartcityback
spring.profiles.active=dev
springdoc.swagger-ui.url=/openapi/enhanced-openapi.json

# JWT — HS256, 256-bit key. Set JWT_SECRET env var (base64-encoded, min 32 bytes).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Rate limiting — auth endpoints only (login + refresh). 10 attempts per minute per IP.
app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-per-minute=10

# In-memory users. Set ADMIN_PASSWORD and VIEWER_PASSWORD env vars.
app.security.admin.password=${ADMIN_PASSWORD}
app.security.viewer.password=${VIEWER_PASSWORD}
