spring.config.activate.on-profile=ci

server.port=8080
server.servlet.contextPath=/SmartCityREST

# H2 in-memory DB for local schema generation without a real PostgreSQL instance
spring.datasource.url=jdbc:h2:mem:smartcity;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
