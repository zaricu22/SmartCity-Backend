# 1. The name of your workflow
name: Backend CI/CD Pipeline

# 2. The TRIGGER: When should this run?
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'src/main/resources/static/openapi/**'
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template*.md'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# 3. The JOBS: What should it do?
jobs:
  # -------------------------------------------------------------------------
  # JOB 1: SECURITY - The "Shield"
  # -------------------------------------------------------------------------
  security-static:
    name: Security Scan - Static
    # GitHub-hosted runner, maintained by GitHub
    runs-on: ubuntu-latest

    # 4. The STEPS: The individual commands
    steps:
      # fetch-depth: 0 required for Gitleaks to scan full history
      - uses: actions/checkout@v4
        with:
          # Required for Gitleaks to scan history
          fetch-depth: 0

      # Gitleaks: Scans commits for secrets (API keys, passwords)
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SAST tool maintained by GitHub, looks for logic vulnerabilities
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Autobuild for CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3

  security-snyk-dependencies:
    name: SNYK Dependency Check
    runs-on: ubuntu-latest
    steps:
      # Clones the repo into the runner
      - uses: actions/checkout@v4

      # Installs JDK 17; 'cache: maven' caches ~/.m2 between runs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Builds the app without running tests, to ensure dependencies are downloaded and available for Snyk scan
      - name: Build app
        run: mvn -B clean package -DskipTests

      # Snyk: Scans project dependencies for known vulnerabilities, with a severity threshold of "high"
      - name: Run Snyk Maven scan
        uses: snyk/actions/maven-3-jdk-17@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --skip-unresolved

  security-owasp-dependencies:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      # Clones the repo into the runner
      - uses: actions/checkout@v4

      # Persists the NVD database between runs to avoid re-downloading it
      - name: Cache OWASP dependency-check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: owasp-java-${{ runner.os }}

      # OWASP Dependency Check: Scans project dependencies for known vulnerabilities
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "smartcityback"
          path: "."
          format: "HTML"
          out: "reports"

      # if: always() — artifact must be available even when the scan step fails (e.g. vulnerability found, NVD download error)
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: reports

  # -------------------------------------------------------------------------
  # JOB 2: TESTING - The "Validator"
  # -------------------------------------------------------------------------
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [ security-static, security-snyk-dependencies, security-owasp-dependencies ]
    steps:
      # Clones the repo into the runner
      - uses: actions/checkout@v4

      # Installs JDK 17; 'cache: maven' caches ~/.m2 between runs
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: mvn verify -e
        env:
          # TEST_ prefix distinguishes these from prod secrets; they are repo-level (github actions secrets)
          # so all jobs can access them without the "Render - production" environment scope
          TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_VIEWER_PASSWORD: ${{ secrets.TEST_VIEWER_PASSWORD }}

      # GitHub Action Artifact: Upload jacoco report to be used by SonarCloud and Codecov
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      # Codecov: Uploads test coverage reports to a visual dashboard
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
          verbose: true

      # if: always() — artifact must be available even when tests fail (Surefire reports are most useful for diagnosing failures)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # -------------------------------------------------------------------------
  # JOB 3: ARCHITECTURE - The "Guardian"
  # Runs in parallel with test — pure bytecode analysis, no DB or secrets needed.
  # Fails fast if any DDD layer rule, naming convention, or structural constraint is violated.
  # -------------------------------------------------------------------------
  architecture:
    name: DDD Architecture Check
    runs-on: ubuntu-latest
    needs: [ security-static, security-snyk-dependencies, security-owasp-dependencies ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run ArchUnit
        run: mvn test-compile surefire:test -Dtest=DddArchitectureTest -DfailIfNoSpecifiedTests=false

  # -------------------------------------------------------------------------
  # JOB 4: CODE QUALITY - The "Linter"
  # -------------------------------------------------------------------------
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    needs: [ security-static, security-snyk-dependencies, security-owasp-dependencies, test, architecture ]
    permissions:
      contents: read
      pull-requests: read
    env:
      # Efficient GC, gives SonarCloud clean heap space
      MAVEN_OPTS: "-Xmx4g -XX:+UseG1GC"
    steps:
      # fetch-depth: 0 required for SonarCloud blame data
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs JDK 17; 'cache: maven' caches ~/.m2 between runs
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Persists the SonarCloud scanner cache between runs
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      # Checkstyle: Annotates PRs with style violations (spacing, naming, etc.)
      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle.xml
          level: error
          fail_level: error

      # PMD: Detects common programming flaws (empty catch blocks, unused code)
      - name: Run PMD
        uses: pmd/pmd-github-action@v2
        with:
          rulesets: 'rulesets/java/quickstart.xml'
          analyzeModifiedFilesOnly: false

      # Download jacoco report to be used by SonarCloud
      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      # SonarCloud: In-depth analysis of technical debt and code smells.
      # qualitygate.wait=true — makes the step block until SonarCloud processes results
      # and fails CI if the quality gate is not met. Without this flag the step always
      # passes regardless of gate outcome. The built-in "Sonar way" quality gate enforces:
      # 80% coverage on new code (stricter than the project floor), no new bugs,
      # no new vulnerabilities, no new security hotspots.
      # Temporarily disabled: SonarCloud's alm_integration/show_pullrequest API is returning
      # a server-side 500 for this project's PR analysis (not a token/permissions/config issue
      # on our side — confirmed via -e stack trace). Re-enable by removing `if: false` once
      # SonarCloud resolves it or the project's repository binding is re-saved.
      - name: SonarCloud Analysis
        if: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: mvn -e package -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=zaricu22_SmartCity-Backend
          -Dsonar.projectName=smartcityback
          -Dsonar.organization=zaricu22
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true

  # -------------------------------------------------------------------------
  # JOB 5: OPENAPI AI ENRICHMENT
  # Runs before deployment: starts the app locally with H2, generates the raw
  # schema, enriches it with Claude, and commits it back. Render then pulls
  # this commit when the deploy hook fires, so the fresh enriched JSON is
  # baked into the JAR that actually gets deployed.
  # -------------------------------------------------------------------------
  openapi-ai-enrichment:
    name: OpenAPI AI Enrichment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, code-quality]

    steps:
      # Checkout repo with write token to push enriched schema back
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # Check if any API-contract files changed since the last enrichment commit.
      # Compares against the last "docs: update enriched OpenAPI" commit so multi-commit
      # pushes are handled correctly — any API change since last enrichment triggers a re-run.
      - name: Check if API files changed since last enrichment
        id: api_changed
        run: |
          LAST=$(git log --format="%H" --grep="docs: update enriched OpenAPI" -1)
          if [ -z "$LAST" ]; then
            echo "No previous enrichment commit found — running enrichment."
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            DIFF=$(git diff --name-only "$LAST" HEAD -- \
              'src/main/java/**/webapi/controller/**' \
              'src/main/java/**/webapi/request/**' \
              'src/main/java/**/webapi/response/**' \
              'src/main/java/**/webapi/exception/ErrorResponse.java')
            if [ -n "$DIFF" ]; then
              echo "API files changed since last enrichment:"
              echo "$DIFF"
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "No API files changed since last enrichment — skipping."
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: actions/setup-java@v4
        if: steps.api_changed.outputs.changed == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/setup-python@v5
        if: steps.api_changed.outputs.changed == 'true'
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.api_changed.outputs.changed == 'true'
        run: pip install anthropic

      # Start app with H2 (ci profile), hit /v3/api-docs, write openapi.json, stop app
      # Uses TEST_ secrets (from repo-level/github actions) not environment-scoped to "Render - production"
      # app.jwt.secret in application-ci.properties maps to JWT_SECRET (from github actions)
      - name: Generate OpenAPI schema locally
        if: steps.api_changed.outputs.changed == 'true'
        env:
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          VIEWER_PASSWORD: ${{ secrets.TEST_VIEWER_PASSWORD }}
        run: mvn verify -Pgenerate-openapi -DskipTests

      - name: Enrich OpenAPI schema with Claude
        if: steps.api_changed.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/enrich_openapi.py

      # Install Node
      - uses: actions/setup-node@v4
        if: steps.api_changed.outputs.changed == 'true'
        with:
          node-version: '22'

      # Validate enriched OpenAPI schema
      - name: Validate enriched OpenAPI
        if: steps.api_changed.outputs.changed == 'true'
        run: |
          npx @apidevtools/swagger-cli validate \
            src/main/resources/static/openapi/enhanced-openapi.json

      # Commit enriched schema
      - name: Commit enriched OpenAPI
        if: steps.api_changed.outputs.changed == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/main/resources/static/openapi/enhanced-openapi.json
          git diff --cached --quiet || (git commit -m "docs: update enriched OpenAPI" && git push)

  # -------------------------------------------------------------------------
  # JOB 6: RELEASE & DEPLOY - The "Shipper"
  # Conditional: This job ONLY runs when code hits 'main'.
  # Depends on enrichment so the deploy hook fires after the enriched schema
  # is committed — Render pulls latest main and builds with it baked in.
  # -------------------------------------------------------------------------
  release-and-deploy:
    name: Semantic Release & Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # "Render - production" environment gates access to JWT_SECRET, ADMIN_PASSWORD,
    # VIEWER_PASSWORD, RENDER_DEPLOY_HOOK_URL, RENDER_API_KEY — add new prod secrets there
    environment: Render - production
    needs: [test, code-quality, openapi-ai-enrichment]
    steps:
      # Checkout repo with write token for pushing tags and releases
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # Install Node.js 20 for Semantic Release and deployment scripts
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Service ID is embedded in the hook URL (format: .../deploy/srv-xxxxx?key=...)
      # and is needed later to poll the Render API — RENDER_DEPLOY_HOOK_URL must keep this format
      - name: Trigger Render deployment
        id: deploy
        run: |
          HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          SERVICE_ID=$(echo "$HOOK_URL" | grep -oP '(?<=deploy/)[^?]+')
          echo "Service ID: $SERVICE_ID"
          echo "service_id=$SERVICE_ID" >> $GITHUB_OUTPUT
          curl -s -X POST "$HOOK_URL"
          echo "Deploy hook triggered."

      # RENDER_API_KEY (Render → Account Settings → API Keys) stored in the "Render - production" environment.
      # It authenticates GET /v1/services/{id}/deploys/{deployId} which returns the status of the
      # specific deploy we triggered (live / build_failed / update_failed).
      # Without it we can only ping old successful deployment which always returns 200 (success running),
      # even though new deploy crashes or still waiting,
      # because Render don't change old one before new deployment success.
      - name: Smoke Test - Wait for deployment
        run: |
          SERVICE_ID="${{ steps.deploy.outputs.service_id }}"
          echo "Waiting 10s for deploy to register on Render..."
          sleep 10
          DEPLOYS_RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=1")
          echo "Deploys API response: $DEPLOYS_RESPONSE"
          DEPLOY_ID=$(echo "$DEPLOYS_RESPONSE" | jq -r '.[0].deploy.id // .[0].id')
          echo "Polling deploy $DEPLOY_ID (every 20s, up to 10 min)..."
          for i in {1..30}; do
            DEPLOY_RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID")
            STATUS=$(echo "$DEPLOY_RESPONSE" | jq -r '.deploy.status // .status')
            echo "Attempt $i/30: status=$STATUS"
            case "$STATUS" in
              live)
                echo "Deployment is live!"
                exit 0
                ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "Deployment failed with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "Timeout: deployment did not reach live status within 600 seconds"
          exit 1

      # Pull latest main before semantic-release: openapi-ai-enrichment may have pushed a commit
      # ("docs: update enriched OpenAPI") after this job's checkout. Without this pull, semantic-release
      # sees the local branch as behind remote and skips the release entirely.
      - name: Pull latest main
        run: git pull origin main --rebase

      # Semantic Release: runs only after deploy is confirmed live — prevents stranded
      # tags/releases when a deploy fails (old order created the tag/release before knowing the deploy outcome)
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npx \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            semantic-release \
            --plugins @semantic-release/commit-analyzer \
            --plugins @semantic-release/release-notes-generator \
            --plugins @semantic-release/github
