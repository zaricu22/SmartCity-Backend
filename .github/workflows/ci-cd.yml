# 1. The name of your workflow
name: Backend CI/CD Pipeline

# 2. The TRIGGER: When should this run?
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'src/main/resources/static/openapi/**'
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template*.md'
  pull_request:
    branches: [main]

# 3. The JOBS: What should it do?
jobs:
  # -------------------------------------------------------------------------
  # JOB 1: SECURITY - The "Shield"
  # -------------------------------------------------------------------------
  security-static:
    name: Security Scan - Static
    # GitHub-hosted runner, maintained by GitHub
    runs-on: ubuntu-latest 

    # 4. The STEPS: The individual commands
    steps:
      # fetch-depth: 0 required for Gitleaks to scan full history
      - uses: actions/checkout@v4
        with:
          # Required for Gitleaks to scan history
          fetch-depth: 0

      # Gitleaks: Scans commits for secrets (API keys, passwords)
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SAST tool maintained by GitHub, looks for logic vulnerabilities
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Autobuild for CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3

  security-snyk-dependencies:
    name: SNYK Dependency Check
    runs-on: ubuntu-latest 
    steps:
      # Clones the repo into the runner
      - uses: actions/checkout@v4

      # Installs JDK 17; 'cache: maven' caches ~/.m2 between runs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Builds the app without running tests, to ensure dependencies are downloaded and available for Snyk scan
      - name: Build app
        run: mvn -B clean package -DskipTests

      # Snyk: Scans project dependencies for known vulnerabilities, with a severity threshold of "high"
      - name: Run Snyk Maven scan
        uses: snyk/actions/maven-3-jdk-17@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --skip-unresolved

  security-owasp-dependencies:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest 
    steps:
      # Clones the repo into the runner
      - uses: actions/checkout@v4

      # Persists the NVD database between runs to avoid re-downloading it
      - name: Cache OWASP dependency-check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: owasp-java-${{ runner.os }}

      # OWASP Dependency Check: Scans project dependencies for known vulnerabilities
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "smartcityback"
          path: "."
          format: "HTML"
          out: "reports"

      # if: always() — artifact must be available even when the scan step fails (e.g. vulnerability found, NVD download error)
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: reports

  # -------------------------------------------------------------------------
  # JOB 2: TESTING - The "Validator"
  # -------------------------------------------------------------------------
  test:
    name: Build and Test
    runs-on: ubuntu-latest 
    needs: [ security-static, security-snyk-dependencies, security-owasp-dependencies ]
    steps:
      # Clones the repo into the runner
      - uses: actions/checkout@v4

      # Installs JDK 17; 'cache: maven' caches ~/.m2 between runs
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: mvn verify -e
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # GitHub Action Artifact: Upload jacoco report to be used by SonarCloud and Codecov
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      # Codecov: Uploads test coverage reports to a visual dashboard
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
          verbose: true

      # if: always() — artifact must be available even when tests fail (Surefire reports are most useful for diagnosing failures)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # -------------------------------------------------------------------------
  # JOB 3: ARCHITECTURE - The "Guardian"
  # Runs in parallel with test — pure bytecode analysis, no DB or secrets needed.
  # Fails fast if any DDD layer rule, naming convention, or structural constraint is violated.
  # -------------------------------------------------------------------------
  architecture:
    name: DDD Architecture Check
    runs-on: ubuntu-latest
    needs: [ security-static, security-snyk-dependencies, security-owasp-dependencies ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run ArchUnit
        run: mvn test-compile surefire:test -Dtest=DddArchitectureTest -DfailIfNoSpecifiedTests=false

  # -------------------------------------------------------------------------
  # JOB 4: CODE QUALITY - The "Linter"
  # -------------------------------------------------------------------------
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    needs: [ security-static, security-snyk-dependencies, security-owasp-dependencies, test, architecture ]
    env:
      # Efficient GC, gives SonarCloud clean heap space
      MAVEN_OPTS: "-Xmx4g -XX:+UseG1GC"
    steps:
      # fetch-depth: 0 required for SonarCloud blame data
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs JDK 17; 'cache: maven' caches ~/.m2 between runs
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Persists the SonarCloud scanner cache between runs
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      # Checkstyle: Annotates PRs with style violations (spacing, naming, etc.)
      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle.xml
          level: error
          fail_level: error

      # PMD: Detects common programming flaws (empty catch blocks, unused code)
      - name: Run PMD
        uses: pmd/pmd-github-action@v2
        with:
          rulesets: 'rulesets/java/quickstart.xml'
          analyzeModifiedFilesOnly: false

      # Download jacoco report to be used by SonarCloud
      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      # SonarCloud: In-depth analysis of technical debt and code smells
      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn verify sonar:sonar
          -Dsonar.projectKey=zaricu22_SmartCity-Backend
          -Dsonar.organization=zaricu22
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # -------------------------------------------------------------------------
  # JOB 5: OPENAPI AI ENRICHMENT
  # Runs before deployment: starts the app locally with H2, generates the raw
  # schema, enriches it with Claude, and commits it back. Render then pulls
  # this commit when the deploy hook fires, so the fresh enriched JSON is
  # baked into the JAR that actually gets deployed.
  # The commit uses "docs:" prefix and the trigger has paths-ignore on the
  # openapi directory, so it never re-triggers the pipeline.
  # -------------------------------------------------------------------------
  openapi-ai-enrichment:
    name: OpenAPI AI Enrichment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, code-quality]

    steps:
      # Checkout repo with write token to push enriched schema back
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # Skip all expensive steps if no API-contract files changed
      - name: Check if OpenAPI-relevant files changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            openapi:
              - 'src/main/java/**/webapi/controller/**'
              - 'src/main/java/**/webapi/request/**'
              - 'src/main/java/**/webapi/response/**'
              - 'src/main/java/**/webapi/exception/ErrorResponse.java'
              - 'src/main/resources/application*.properties'

      - uses: actions/setup-java@v4
        if: steps.filter.outputs.openapi == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Setup Python
      - uses: actions/setup-python@v5
        if: steps.filter.outputs.openapi == 'true'
        with:
          python-version: '3.12'

      # Install Claude SDK
      - name: Install Python dependencies
        if: steps.filter.outputs.openapi == 'true'
        run: pip install anthropic

      # Start app with H2 (ci profile), hit /v3/api-docs, write openapi.json, stop app
      - name: Generate OpenAPI schema locally
        if: steps.filter.outputs.openapi == 'true'
        run: mvn verify -Pgenerate-openapi -DskipTests

      # Run Claude enrichment
      - name: Enrich OpenAPI schema with Claude
        if: steps.filter.outputs.openapi == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/enrich_openapi.py

      # Install Node
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.openapi == 'true'
        with:
          node-version: '22'

      # Validate enriched OpenAPI schema
      - name: Validate enriched OpenAPI
        if: steps.filter.outputs.openapi == 'true'
        run: |
          npx @apidevtools/swagger-cli validate \
            src/main/resources/static/openapi/enhanced-openapi.json

      # Commit enriched schema
      - name: Commit enriched OpenAPI
        if: steps.filter.outputs.openapi == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/main/resources/static/openapi/enhanced-openapi.json
          git diff --cached --quiet || (git commit -m "docs: update enriched OpenAPI" && git push)

  # -------------------------------------------------------------------------
  # JOB 6: RELEASE & DEPLOY - The "Shipper"
  # Conditional: This job ONLY runs when code hits 'main'.
  # Depends on enrichment so the deploy hook fires after the enriched schema
  # is committed — Render pulls latest main and builds with it baked in.
  # -------------------------------------------------------------------------
  release-and-deploy:
    name: Semantic Release & Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Render - production
    needs: [test, code-quality, openapi-ai-enrichment]
    steps:
      # Checkout repo with write token for pushing tags and releases
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # Install Node.js 20 for Semantic Release and deployment scripts
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Semantic Release: Automates SemVer versioning and creates GitHub Releases
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npx \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            semantic-release \
            --plugins @semantic-release/commit-analyzer \
            --plugins @semantic-release/release-notes-generator \
            --plugins @semantic-release/github

      # Deployment: Triggers Render to pull latest main (includes enriched schema) and build
      - name: Trigger Render deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # Smoke Test: Pings the live URL every 20s to confirm successful deploy
      - name: Smoke Test - Health Check
        run: |
          echo "Waiting for Render to deploy (checking every 20s)..."
          for i in {1..20}; do
            if curl --fail --silent https://smartcity-backend-9g09.onrender.com/SmartCityREST/actuator/health; then
              echo "App is LIVE and healthy!"
              exit 0
            fi
            echo "Not ready yet, retrying in 20 seconds..."
            sleep 20
          done
          echo "Timeout: App failed to start in 400 seconds."
          exit 1
