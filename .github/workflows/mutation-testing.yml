name: Mutation Testing

on:
  # Also can be run manually
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  pitest:
    name: PIT Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # test-compile only: skips Surefire, JaCoCo, and Spring Boot repackage (handled by -Pmutation-testing)
      - name: Run PIT mutation testing
        env:
          MAVEN_OPTS: "-Xmx1g"
        run: mvn -e test-compile org.pitest:pitest-maven:1.9.11:mutationCoverage -Pmutation-testing

      # if: always() — artifact must be available even when mutation thresholds fail (report shows which mutants survived)
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: target/pit-reports
